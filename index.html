<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<meta name="description" content="Teoría musical, entrenamiento auditivo e improvisación para guitarra. 100 % offline.">
<title>Diapasón · Teoría y oído para guitarra</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B8%3C/text%3E%3C/svg%3E">
<style>
/* =====================================================================
   DIAPASÓN · ESTILOS (mobile-first, modo claro/oscuro, estética de juego)
   ===================================================================== */
:root {
  --bg: #f3f4fa; --panel: #ffffff; --panel2: #eceef7; --text: #1a1c2b; --muted: #676d86; --line: #dde0ec;
  --good: #1fb45a; --good-d: #168a44; --bad: #e5484d; --bad-d: #b8363a; --warn: #f5b300; --warn-d: #c78f00;
  --lock: #b9bdcc; --accent: #6c5ce7; --accent-d: #4e3fc9;
  --wood: #e9d2b4; --wood2: #dcc09b; --fretc: #9a8f82; --stringc: #5f5a55; --inlay: #f7efe3;
  --O: #8b5cf6; --O-d: #6d3fd8; --P: #3b82f6; --P-d: #2563c9; --N: #10b981; --N-d: #0b8f63; --M: #f97316; --M-d: #cc5a0c;
  --shadow: 0 2px 0 rgba(20, 22, 40, .06), 0 6px 20px rgba(20, 22, 40, .06);
  --r: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10121b; --panel: #1a1d2b; --panel2: #232738; --text: #eef0f8; --muted: #9aa0b9; --line: #2d3246;
    --lock: #454b61; --wood: #3b3027; --wood2: #33291f; --fretc: #8d8478; --stringc: #b8b0a6; --inlay: #57493b;
    --shadow: 0 2px 0 rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10121b; --panel: #1a1d2b; --panel2: #232738; --text: #eef0f8; --muted: #9aa0b9; --line: #2d3246;
  --lock: #454b61; --wood: #3b3027; --wood2: #33291f; --fretc: #8d8478; --stringc: #b8b0a6; --inlay: #57493b;
  --shadow: 0 2px 0 rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overflow-x: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { max-width: 760px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.top h1 { font-size: 20px; margin: 0; flex: 1; letter-spacing: -.3px; }
.top .sub { font-size: 13px; color: var(--muted); display: block; font-weight: 600; }
.iconbtn { width: 44px; height: 44px; border-radius: 14px; border: 0; background: var(--panel); box-shadow: var(--shadow); font-size: 20px; display: grid; place-items: center; flex: none; }
main { flex: 1; padding: 4px 16px 24px; }
.card { background: var(--panel); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
.muted { color: var(--muted); }
small { font-size: .82em; }
h2 { font-size: 18px; margin: 18px 2px 10px; }
h3 { font-size: 16px; margin: 0 0 6px; }

/* Botones de juego */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; padding: 12px 18px; border: 0; border-radius: 16px; font-weight: 800; font-size: 17px;
  background: var(--accent); color: #fff; box-shadow: 0 4px 0 var(--accent-d); transition: transform .06s, box-shadow .06s; user-select: none; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-d); }
.btn.ghost { background: var(--panel2); color: var(--text); box-shadow: 0 4px 0 var(--line); }
.btn.good { background: var(--good); box-shadow: 0 4px 0 var(--good-d); }
.btn.bad { background: var(--bad); box-shadow: 0 4px 0 var(--bad-d); }
.btn.sm { min-height: 44px; font-size: 15px; padding: 8px 12px; border-radius: 14px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
.stack > * + * { margin-top: 10px; }

/* Inicio */
.hero { display: flex; align-items: center; gap: 12px; }
.logo { width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, var(--O), var(--M)); display: grid; place-items: center; font-size: 28px; box-shadow: var(--shadow); flex: none; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
.stat { background: var(--panel); border-radius: 16px; padding: 10px; text-align: center; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 22px; }
.stat span { font-size: 12px; color: var(--muted); font-weight: 600; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode { border: 0; border-radius: 20px; padding: 16px 14px; text-align: left; color: #fff; min-height: 150px; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; transition: transform .06s; }
.mode:active { transform: translateY(3px); }
.mode .ic { font-size: 30px; }
.mode b { font-size: 17px; line-height: 1.2; }
.mode small { opacity: .92; font-weight: 600; }
.mode .next { margin-top: auto; font-size: 12px; background: rgba(255, 255, 255, .22); border-radius: 10px; padding: 4px 8px; font-weight: 700; align-self: flex-start; }
.mode.O { background: var(--O); box-shadow: 0 5px 0 var(--O-d); } .mode.P { background: var(--P); box-shadow: 0 5px 0 var(--P-d); }
.mode.N { background: var(--N); box-shadow: 0 5px 0 var(--N-d); } .mode.M { background: var(--M); box-shadow: 0 5px 0 var(--M-d); }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bline { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.bline .name { width: 44%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pbar { flex: 1; height: 12px; background: var(--panel2); border-radius: 99px; overflow: hidden; }
.pbar > i { display: block; height: 100%; border-radius: 99px; background: var(--good); transition: width .4s; }

/* Mapa */
.block { margin-bottom: 18px; }
.bhead { display: flex; align-items: center; gap: 10px; margin: 0 2px 10px; }
.bnum { width: 34px; height: 34px; border-radius: 11px; color: #fff; display: grid; place-items: center; font-weight: 900; flex: none; }
.bhead b { font-size: 16px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { border: 0; border-radius: 16px; padding: 12px; text-align: left; min-height: 92px; display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14.5px; line-height: 1.25;
  background: var(--panel); box-shadow: var(--shadow); border-left: 6px solid var(--lock); position: relative; }
.tile.locked { color: var(--muted); background: var(--panel2); }
.tile.open { border-left-color: var(--warn); }
.tile.done { border-left-color: var(--good); }
.tile .st { position: absolute; top: 8px; right: 10px; font-size: 16px; }
.dots { display: flex; gap: 5px; margin-top: auto; }
.dot { font-size: 11px; font-weight: 800; width: 24px; height: 20px; border-radius: 7px; display: grid; place-items: center; background: var(--lock); color: #fff; }
.dot.open { background: var(--warn); } .dot.done { background: var(--good); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 4px 2px 14px; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; background: var(--c); }

/* Lista de temas de un modo */
.tlist { display: flex; flex-direction: column; gap: 8px; }
.titem { display: flex; align-items: center; gap: 12px; border: 0; width: 100%; text-align: left; padding: 12px 14px; border-radius: 16px; background: var(--panel); box-shadow: var(--shadow); min-height: 58px; }
.titem .bn { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13px; flex: none; }
.titem .tt { flex: 1; font-weight: 700; }
.titem .tt small { display: block; color: var(--muted); font-weight: 600; }
.titem.locked { opacity: .55; }
.chip-st { font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 99px; color: #fff; background: var(--lock); white-space: nowrap; }
.chip-st.open { background: var(--warn); color: #3a2a00; } .chip-st.done { background: var(--good); }

/* Lección */
.lesson p, .lesson li { font-size: 16px; }
.lesson ul, .lesson ol { padding-left: 20px; }
.lesson li { margin: 4px 0; }
.lesson .tip { background: var(--panel2); padding: 10px 12px; border-radius: 12px; border-left: 4px solid var(--accent); }
.big2 { font-size: 20px; font-weight: 800; text-align: center; letter-spacing: .5px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.exs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.exs .btn { width: auto; flex: 1 1 auto; min-height: 46px; font-size: 15px; }

/* Ejercicio */
.exbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.exbar .pbar { height: 14px; }
.exbar .score { font-weight: 800; font-size: 15px; min-width: 52px; text-align: right; }
.topicline { font-size: 13px; color: var(--muted); font-weight: 700; padding: 0 16px 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 99px; background: var(--panel2); color: var(--muted); }
.pinned { background: var(--panel2); border-radius: 16px; padding: 10px 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.pin { display: flex; gap: 8px; align-items: baseline; font-size: 15px; }
.pin .pl { font-size: 12px; font-weight: 800; color: var(--muted); min-width: 92px; text-transform: uppercase; letter-spacing: .3px; }
.pin .pv { font-weight: 800; }
.pin.bad .pv { color: var(--bad); } .pin.good .pv { color: var(--good); }
.prompt { font-size: 19px; font-weight: 700; line-height: 1.35; }
.prompt small { font-weight: 600; color: var(--muted); }
.prompt .big { font-size: 28px; font-weight: 900; margin-top: 8px; letter-spacing: .5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; }
.chip { background: var(--panel); border-radius: 12px; padding: 6px 12px; font-weight: 900; font-size: 18px; box-shadow: var(--shadow); }
.prompt .chip { background: var(--panel2); }
.arrow { color: var(--muted); font-weight: 800; }
.audiobar { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.audiobar .btn { flex: 1 1 30%; width: auto; min-height: 52px; font-size: 15px; }
.tempo { display: flex; align-items: center; gap: 8px; background: var(--panel2); border-radius: 14px; padding: 4px 6px; flex: 1 1 100%; }
.tempo b { flex: 1; text-align: center; }
.tempo button { width: 48px; height: 44px; border-radius: 12px; border: 0; background: var(--panel); font-size: 22px; font-weight: 800; box-shadow: var(--shadow); }
.bardots { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; margin: 4px 0 2px; }
.bardots i { width: 22px; height: 10px; border-radius: 99px; background: var(--line); transition: background .1s; }
.bardots i.on { background: var(--P); }
.feedback { border-radius: 16px; padding: 14px; margin-top: 12px; font-size: 15.5px; animation: pop .22s ease-out; }
.feedback.ok { background: color-mix(in srgb, var(--good) 16%, var(--panel)); border: 2px solid var(--good); }
.feedback.ko { background: color-mix(in srgb, var(--bad) 12%, var(--panel)); border: 2px solid var(--bad); }
.feedback .fh { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
.feedback .sol { font-size: 18px; font-weight: 800; }
.feedback .exp { margin-top: 8px; color: var(--text); opacity: .92; }
.feedback .yours { color: var(--muted); font-size: 14px; }
@keyframes pop { from { transform: scale(.97); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.answer { position: sticky; bottom: 0; z-index: 4; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
.keys { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.keys::-webkit-scrollbar { display: none; }
.keys button { flex: none; min-width: 44px; height: 40px; padding: 0 10px; border-radius: 11px; border: 0; background: var(--panel); box-shadow: var(--shadow); font-weight: 800; font-size: 15px; }
.inrow { display: flex; gap: 8px; }
.inrow input { flex: 1; min-width: 0; height: 56px; border-radius: 16px; border: 2px solid var(--line); background: var(--panel); padding: 0 14px; font-size: 18px; font-weight: 700; outline: none; }
.inrow input:focus { border-color: var(--accent); }
.inrow .btn { width: auto; min-width: 104px; }

/* Mástil */
.fretwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 8px -16px; padding: 0 16px 6px; }
.fretwrap svg { display: block; touch-action: pan-x; }
.fb-bg { fill: var(--wood); } .fb-open { fill: var(--panel2); }
.fb-fret { stroke: var(--fretc); stroke-width: 2.5; } .fb-nut { stroke: var(--text); stroke-width: 6; }
.fb-str { stroke: var(--stringc); } .fb-inlay { fill: var(--inlay); }
.fb-num { fill: var(--muted); font-size: 12px; font-weight: 700; text-anchor: middle; }
.fb-sname { fill: var(--muted); font-size: 11px; font-weight: 800; text-anchor: middle; }
.fb-hit { fill: transparent; cursor: pointer; }
.fb-dot { stroke-width: 2.5; }
.fb-dot.sel { fill: var(--accent); stroke: var(--accent-d); }
.fb-dot.fig { fill: var(--P); stroke: var(--P-d); }
.fb-dot.ok { fill: var(--good); stroke: var(--good-d); }
.fb-dot.bad { fill: var(--bad); stroke: var(--bad-d); }
.fb-dot.miss { fill: var(--panel); stroke: var(--warn); stroke-width: 3.5; stroke-dasharray: 5 3; }
.fb-dot.ask { fill: var(--warn); stroke: var(--warn-d); animation: pulse 1s infinite alternate; }
.fb-ring { fill: none; stroke: var(--text); stroke-width: 3; }
.fb-lbl { fill: #fff; font-size: 11.5px; font-weight: 800; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.fb-lbl.dark { fill: var(--text); }
@keyframes pulse { from { opacity: 1; } to { opacity: .55; } }
.flegend { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 6px; }
.flegend i { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 5px; vertical-align: -2px; }

/* Resultado */
.result { text-align: center; padding: 26px 16px; }
.ring { width: 150px; height: 150px; margin: 6px auto 12px; border-radius: 50%; display: grid; place-items: center; font-size: 38px; font-weight: 900;
  background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--panel2) 0); position: relative; }
.ring::after { content: ""; position: absolute; inset: 14px; border-radius: 50%; background: var(--panel); }
.ring span { position: relative; z-index: 1; }
.confetti { font-size: 42px; animation: pop .5s; }

/* Ajustes */
.set { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.set:last-child { border-bottom: 0; }
.set > label, .set > b { font-weight: 800; }
.seg { display: flex; background: var(--panel2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { flex: 1; min-height: 44px; border: 0; border-radius: 11px; background: transparent; font-weight: 700; }
.seg button.on { background: var(--panel); box-shadow: var(--shadow); color: var(--accent); }
input[type=range] { width: 100%; height: 36px; accent-color: var(--accent); }
.help { font-size: 14px; color: var(--muted); }
.help code { background: var(--panel2); padding: 1px 6px; border-radius: 6px; color: var(--text); font-weight: 700; }
.testlog { font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; max-height: 300px; overflow: auto; background: var(--panel2); padding: 10px; border-radius: 12px; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 700; z-index: 50; max-width: 90vw; text-align: center; animation: pop .2s; }
.lessonlink { display: flex; gap: 8px; margin-bottom: 12px; }

@media (min-width: 640px) {
  .tiles { grid-template-columns: repeat(3, 1fr); }
  .modes { grid-template-columns: repeat(4, 1fr); }
  .prompt { font-size: 21px; }
}
</style>

<noscript><p style="padding:20px">Diapasón necesita JavaScript activado.</p></noscript>
<script>
/* Diapasón · aplicación de teoría musical, oído e improvisación para guitarra.
   Archivo único y autocontenido: sin dependencias externas, funciona sin conexión.
   Estructura: [Núcleo: teoría · parser · generadores · currículum · pruebas] + [Interfaz: almacén · audio · mástil · pantallas] */
'use strict';
const Core = (() => {
/* =====================================================================
   DIAPASÓN · NÚCLEO 1/5 · TEORÍA MUSICAL
   ---------------------------------------------------------------------
   Todo el núcleo es JavaScript puro, sin DOM, para poder probarlo en Node.
   Representación interna:
     - Nota deletreada: {l: índice de letra 0..6 (C..B), a: alteración -2..+2}
     - Clase de altura (pc): 0..11 (C = 0)
     - Acorde: {r: nota raíz, q: clave de calidad en QUAL}
     - Tonalidad: {t: nota tónica, m: 'maj' | 'min'}
   ===================================================================== */

/* ---------- 0. Utilidades ---------- */
const mod = (n, m = 12) => ((n % m) + m) % m;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const uniq = a => [...new Set(a)];
const setEq = (a, b) => { const A = new Set(a), B = new Set(b); if (A.size !== B.size) return false; for (const x of A) if (!B.has(x)) return false; return true; };
const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };
const byTier = (t, a, b, c) => (t >= 2 ? c : t >= 1 ? b : a);

/* ---------- 1. Notas ---------- */
const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
const LATIN = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La', 'Si'];
const NAT = [0, 2, 4, 5, 7, 9, 11];
let NOTATION = 'latin';
const setNotation = n => { NOTATION = n === 'american' ? 'american' : 'latin'; };
const getNotation = () => NOTATION;
const note = (l, a = 0) => ({ l, a });
const pcOf = n => mod(NAT[n.l] + n.a);
const accTxt = a => (a > 0 ? '#'.repeat(a) : 'b'.repeat(-a));
const noteName = (n, nt = NOTATION) => (nt === 'american' ? LETTERS : LATIN)[n.l] + accTxt(n.a);
/** Nota desde texto interno americano: 'C', 'F#', 'Bb', 'E##' */
function N(s) { const l = LETTERS.indexOf(s[0]); let a = 0; for (const ch of s.slice(1)) { if (ch === '#') a++; else if (ch === 'b') a--; } return note(l, a); }
const alter = (n, acc) => (acc === '#' ? note(n.l, n.a + 1) : acc === 'b' ? note(n.l, n.a - 1) : n);
const SHARP_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const FLAT_NAMES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
const noteFromPc = (pc, pref = '#') => N((pref === '#' ? SHARP_NAMES : FLAT_NAMES)[mod(pc)]);
/** Nombre de una clase de altura: "C#/Db" si es alterada */
const pcLabel = pc => { const s = noteFromPc(pc, '#'), f = noteFromPc(pc, 'b'); return s.a ? `${noteName(s)}/${noteName(f)}` : noteName(s); };
const doubleAcc = notes => notes.some(n => Math.abs(n.a) >= 2);
/** Notas "raras" (Cb, Fb, E#, B#) que evitamos en ejercicios aleatorios de acordes */
const weird = n => Math.abs(n.a) >= 2 || (n.a === -1 && (n.l === 0 || n.l === 3)) || (n.a === 1 && (n.l === 2 || n.l === 6));

/* ---------- 2. Intervalos ---------- */
// intervalo → [pasos de letra, semitonos]

/**
 * Figura de escala en el mástil.
 * Posición n = empieza en el grado n de la escala sobre la 6ª cuerda.
 * Pentatónicas: 2 notas por cuerda (las 5 "cajas" clásicas).
 * Escalas de 7 notas: sistema de 3 notas por cuerda (7 posiciones).
 * Blues: caja de la pentatónica menor + b5 un traste por encima de cada 4ª.

  if (doubleAcc(notes) || pos < 1 || pos > ivs.length) return null;
  const nps = ivs.length === 5 ? 2 : 3;
  const f0 = mod(pcs[pos - 1] - 4);
  const seq = [];
  for (let m = 40 + f0; seq.length < 6 * nps; m++) { const i = pcs.indexOf(mod(m)); if (i >= 0) seq.push({ m, i }); }
  const cells = seq.map((x, j) => { const s = Math.floor(j / nps); return { s, f: x.m - TUNING[s], pc: mod(x.m), iv: ivs[x.i], n: notes[x.i] }; });

    const b5 = tr(root, 'b5'); if (Math.abs(b5.a) >= 2) return null;
    cells.filter(c => c.iv === '4').forEach(c => cells.push({ s: c.s, f: c.f + 1, pc: pcOf(b5), iv: 'b5', n: b5 }));
  }
  if (cells.some(c => c.f < 0 || c.f > 15)) return null;
  cells.sort((a, b) => a.s - b.s || a.f - b.f);
  return { root, type, pos, start: f0, cells, rootPc: pcOf(root), nps };
}

/**
 * Busca digitaciones tocables: bajo = tónica en la 6ª, 5ª o 4ª cuerda,
 * ventana de 4 trastes, cuerdas al aire permitidas, sin cuerdas muteadas en medio,

/* =====================================================================
   DIAPASÓN · NÚCLEO 2/5 · PARSER DE RESPUESTAS
   Acepta notación latina y americana, enharmonías, mayúsculas/minúsculas,
   espacios, símbolos (♯ ♭ Δ ° ø +) y nombres en español ("Do menor séptima").

function normBasic(s) {
  return String(s == null ? '' : s)
    .replace(/[♯＃]/g, '#').replace(/♭/g, 'b').replace(/𝄪/g, '##').replace(/𝄫/g, 'bb')

/** Lee alteraciones al principio de s: #, b, "sostenido", "bemol" */
function readAcc(s) {
  let a = 0, i = 0;
  for (;;) {
    if (s.startsWith('sostenido', i)) { a++; i += 9; }
    else if (s.startsWith('bemol', i)) { a--; i += 5; }
    else if (s[i] === '#') { a++; i++; }

  const out = []; const m = s.match(LAT_RE);
  if (m) { const r = readAcc(s.slice(m[1].length)); if (Math.abs(r.a) <= 2) out.push({ n: note(LAT_IDX[m[1]], r.a), rest: r.rest }); }

<li>La 6ª y la 1ª cuerda tienen las mismas notas.</li></ul>
<p>Empieza por las naturales de la <b>6ª y 5ª</b>: son las tónicas de casi todos los acordes con cejilla.</p>
<p class="tip">6ª: ${n('G')}=3, ${n('A')}=5, ${n('B')}=7, ${n('C')}=8, ${n('D')}=10 · 5ª: ${n('B')}=2, ${n('C')}=3, ${n('D')}=5, ${n('E')}=7, ${n('F')}=8, ${n('G')}=10.</p>`,
    ex: [{ t: 'fretnat' }] }),
  f4: () => ({ html: `
<p>La escala mayor tiene 7 notas y sigue la fórmula <b>T-T-S-T-T-T-S</b>.</p>
<p>Desde ${n('C')}: <b>${scn('C', 'major')}</b>. No lleva alteraciones.</p>
<p>Desde otra nota aplica la fórmula y <b>usa cada letra una sola vez</b>:<br>${scl('G', 'major')} = <b>${scn('G', 'major')}</b> · ${scl('F', 'major')} = <b>${scn('F', 'major')}</b>.</p>
<p>Cada nota es un <b>grado</b> (1 a 7). El 7º está a un semitono de la tónica: es la <b>sensible</b>, que "pide" volver a casa.</p>`,
    ex: [{ t: 'scale', r: 'C', type: 'major' }, { t: 'scale', r: 'G', type: 'major' }, { t: 'scale', r: 'F', type: 'major' }] }),
  f5: () => ({ html: `
<p>Un <b>intervalo</b> es la distancia entre dos notas. Se nombra con un número (contando letras) y un tipo (mayor, menor, justa).</p>
<table class="tbl"><tr><th>Semitonos</th><th>Intervalo</th><th>Sensación</th></tr>
${INTERVALS.map(i => `<tr><td>${i.s}</td><td>${i.name} <small>(${i.short})</small></td><td>${INTERVAL_FEEL[i.s]}</td></tr>`).join('')}</table>
<p class="tip">Responde como prefieras: "3M", "3m", "5J", "tercera mayor", "tritono"...</p>`,
    ex: [{ t: 'iv', r: 'C', s: 3 }, { t: 'iv', r: 'C', s: 4 }, { t: 'iv', r: 'C', s: 5 }, { t: 'iv', r: 'C', s: 7 }, { t: 'iv', r: 'C', s: 12 }] }),
  t1: () => ({ html: `
<p>Una <b>triada</b> son 3 notas apiladas en terceras: <b>tónica (1), tercera (3) y quinta (5)</b>.</p>
<ul><li><b>Mayor</b> = 1-3-5 → +4 y +3 semitonos. ${c('C')} = <b>${ns(['C', 'E', 'G'])}</b>. Suena luminoso y estable.</li>
<li><b>Menor</b> = 1-b3-5 → +3 y +4 semitonos. ${c('Cm')} = <b>${ns(['C', 'Eb', 'G'])}</b>. Suena triste y oscuro.</li></ul>
<p>Solo cambia la <b>3ª</b>, que baja un semitono. La 5ª es igual en los dos: la 3ª decide el color.</p>
<p class="tip">Se escribe ${c('C')} para mayor y ${c('Cm')} para menor ("${n('C')} menor").</p>`,
    ex: [{ t: 'chord', v: 'C' }, { t: 'chord', v: 'Cm' }, { t: 'notes', v: ['C', 'E', 'G'], label: 'Arpegio mayor' }, { t: 'notes', v: ['C', 'Eb', 'G'], label: 'Arpegio menor' }] }),
  t2: () => ({ html: `
<p>Aplica la fórmula desde cualquier nota: <b>mayor = +4 +3</b> · <b>menor = +3 +4</b> semitonos.</p>
<p>Truco: primero las letras "salteadas" (1-3-5 = letra sí, letra no), luego ajusta con # o b:</p>
<ul><li>${c('D')} = ${ns(['D', 'F#', 'A'])} · ${c('Dm')} = ${ns(['D', 'F', 'A'])}</li>
<li>${c('E')} = ${ns(['E', 'G#', 'B'])} · ${c('Em')} = ${ns(['E', 'G', 'B'])}</li>
<li>${c('A')} = ${ns(['A', 'C#', 'E'])} · ${c('Am')} = ${ns(['A', 'C', 'E'])}</li></ul>`,
    ex: [{ t: 'chord', v: 'D' }, { t: 'chord', v: 'Dm' }, { t: 'chord', v: 'E' }, { t: 'chord', v: 'Em' }, { t: 'chord', v: 'A' }, { t: 'chord', v: 'Am' }] }),
  t3: () => ({ html: `
<p>Mismo método con tónicas alteradas:</p>
<ul><li>${c('Bb')} = <b>${ns(['Bb', 'D', 'F'])}</b></li><li>${c('F#m')} = <b>${ns(['F#', 'A', 'C#'])}</b></li><li>${c('Eb')} = <b>${ns(['Eb', 'G', 'Bb'])}</b></li><li>${c('C#m')} = <b>${ns(['C#', 'E', 'G#'])}</b></li></ul>
<p>Escribe primero las letras (${ns(['B', 'D', 'F'])}) y luego ajusta las alteraciones. Dentro del acorde se usa la letra correcta (${ns(['Bb', 'D', 'F'])}, no ${ns(['A#', 'D', 'F'])}), aunque aquí se aceptan las enharmonías.</p>`,
    ex: [{ t: 'chord', v: 'Bb' }, { t: 'chord', v: 'F#m' }, { t: 'chord', v: 'Eb' }, { t: 'chord', v: 'C#m' }] }),
  h1: () => ({ html: `
<p>Si construyes una triada sobre cada nota de la escala mayor, usando solo notas de la escala, obtienes el <b>campo armónico</b>:</p>
<p class="big2">I · ii · iii · IV · V · vi · vii°</p>
<p>En ${n('C')}: <b>${field(key('C', 'maj')).map(x => chordName(x)).join(' · ')}</b></p>
<p>El patrón es el mismo en <b>todas</b> las tonalidades mayores: mayor, menor, menor, mayor, mayor, menor, disminuido. Mayúsculas = mayor, minúsculas = menor, ° = disminuido.</p>
<ul><li><b>Tónica</b> (casa, reposo): I (y también vi, iii).</li><li><b>Subdominante</b> (alejarse de casa): IV (y ii).</li><li><b>Dominante</b> (tensión que pide volver): V (y vii°).</li></ul>
<p class="tip">V → I es la resolución más fuerte: la sensible (${n('B')}) sube a la tónica (${n('C')}).</p>`,
    ex: [{ t: 'prog', k: 'C', m: 'maj', specs: ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°', 'I'], label: 'Campo de ' + n('C') }, { t: 'prog', k: 'C', m: 'maj', specs: ['I', 'IV', 'V', 'I'], label: 'I-IV-V-I' }, { t: 'prog', k: 'C', m: 'maj', specs: ['V', 'I'], label: 'V → I' }, { t: 'prog', k: 'C', m: 'maj', specs: ['I', 'V', 'vi', 'IV'], label: 'I-V-vi-IV' }] }),
  h2: () => ({ html: `
<p>El campo armónico se traslada igual a cualquier tonalidad. Tonalidades con sostenidos (ciclo de quintas):</p>
<ul><li>${n('G')} (1#: ${n('F#')}): ${field(key('G', 'maj')).map(x => chordName(x)).join(' ')}</li>
<li>${n('D')} (2#: ${ns(['F#', 'C#'])}): ${field(key('D', 'maj')).map(x => chordName(x)).join(' ')}</li>
<li>${n('A')} (3#) · ${n('E')} (4#)</li></ul>
<p class="tip">Truco: el V de una tonalidad es la siguiente del ciclo con un sostenido más (${n('C')} → ${n('G')} → ${n('D')} → ${n('A')} → ${n('E')}).</p>`,
    ex: [{ t: 'prog', k: 'G', m: 'maj', specs: ['I', 'IV', 'V', 'I'], label: `I-IV-V-I en ${n('G')}` }, { t: 'prog', k: 'D', m: 'maj', specs: ['I', 'vi', 'IV', 'V'], label: `I-vi-IV-V en ${n('D')}` }] }),
  h3: () => ({ html: `
<p>Tonalidades con bemoles: ${n('F')} (1b: ${n('Bb')}), ${n('Bb')} (2b), ${n('Eb')} (3b), ${n('Ab')} (4b).</p>
<ul><li>${n('F')}: ${field(key('F', 'maj')).map(x => chordName(x)).join(' ')}</li><li>${n('Bb')}: ${field(key('Bb', 'maj')).map(x => chordName(x)).join(' ')}</li></ul>
<p class="tip">Truco: el IV de una tonalidad es la siguiente con un bemol más (${n('C')} → ${n('F')} → ${n('Bb')} → ${n('Eb')} → ${n('Ab')}).</p>`,
    ex: [{ t: 'prog', k: 'F', m: 'maj', specs: ['I', 'IV', 'V', 'I'], label: `I-IV-V-I en ${n('F')}` }, { t: 'prog', k: 'Bb', m: 'maj', specs: ['I', 'V', 'vi', 'IV'], label: `I-V-vi-IV en ${n('Bb')}` }] }),
  h4: () => ({ html: `
<p>Para cualquier tonalidad: 1) escribe la escala mayor, 2) aplica el patrón <b>M m m M M m dim</b>.</p>
<p>Progresiones típicas: I-V-vi-IV (pop), I-vi-IV-V (años 50), ii-V-I, I-iii-IV-V, vi-IV-I-V.</p>
<p class="tip">De oído: busca primero el acorde de reposo (I). El V suele sonar justo antes de volver a casa, y el vi es el "menor triste" de la tonalidad.</p>`,
    ex: [{ t: 'prog', k: 'E', m: 'maj', specs: ['I', 'iii', 'IV', 'V'], label: 'I-iii-IV-V' }, { t: 'prog', k: 'Ab', m: 'maj', specs: ['vi', 'IV', 'I', 'V'], label: 'vi-IV-I-V' }, { t: 'prog', k: 'D', m: 'maj', specs: ['I', 'vi', 'ii', 'V'], label: 'I-vi-ii-V' }] }),
  m1: () => ({ html: `
<p>La <b>menor natural</b> sigue <b>T-S-T-T-S-T-T</b> → grados 1 2 b3 4 5 b6 b7.</p>
<p>${scl('A', 'minor')} = <b>${scn('A', 'minor')}</b> (sin alteraciones).</p>
<p>Comparada con la mayor desde la misma nota, <b>baja la 3ª, la 6ª y la 7ª</b>: ${scl('C', 'major')} = ${scn('C', 'major')} → ${scl('C', 'minor')} = ${scn('C', 'minor')}.</p>
<p class="tip">Suena más oscura y melancólica. Su tónica es un acorde menor.</p>`,
    ex: [{ t: 'scale', r: 'A', type: 'minor' }, { t: 'scale', r: 'C', type: 'major' }, { t: 'scale', r: 'C', type: 'minor' }] }),
  m2: () => ({ html: `
<p>Cada tonalidad mayor comparte todas sus notas con una menor: su <b>relativa</b>.</p>
<ul><li>La relativa menor está en el <b>6º grado</b> de la mayor (3 semitonos por debajo de la tónica).</li><li>La relativa mayor está en el <b>3er grado</b> de la menor.</li></ul>
<p>${n('C')} mayor ↔ ${n('A')} menor · ${n('G')} mayor ↔ ${n('E')} menor · ${n('F')} mayor ↔ ${n('D')} menor.</p>
<p class="tip">Tienen las mismas notas pero distinta "casa": lo que decide la tonalidad es dónde descansa la música.</p>`,
    ex: [{ t: 'prog', k: 'C', m: 'maj', specs: ['I', 'IV', 'V', 'I'], label: `${n('C')} mayor` }, { t: 'prog', k: 'A', m: 'min', specs: ['i', 'iv', 'v', 'i'], label: `${n('A')} menor` }] }),
  m3: () => ({ html: `
<p>Campo armónico menor natural: <b>i · ii° · III · iv · v · VI · VII</b>.</p>
<p>En ${n('A')} menor: <b>${field(key('A', 'min')).map(x => chordName(x)).join(' · ')}</b>. Son los mismos acordes que ${n('C')} mayor, empezando en el vi.</p>
<ul><li>i = casa · iv y VI = alejarse · v y VII = tensión suave.</li></ul>
<p class="tip">Progresiones típicas: i-VI-III-VII (épica), i-VII-VI-VII (rock), i-iv-v-i.</p>`,
    ex: [{ t: 'prog', k: 'A', m: 'min', specs: ['i', 'VI', 'III', 'VII'], label: 'i-VI-III-VII' }, { t: 'prog', k: 'E', m: 'min', specs: ['i', 'VII', 'VI', 'VII'], label: 'i-VII-VI-VII' }, { t: 'prog', k: 'D', m: 'min', specs: ['i', 'iv', 'v', 'i'], label: 'i-iv-v-i' }] }),
  m4: () => ({ html: `
<p>En la menor natural el v es menor (${c('Em')} en ${n('A')} menor), así que la vuelta a casa suena floja.</p>
<p>La solución es <b>subir la 7ª</b> un semitono, y así se obtiene la <b>menor armónica</b>: 1 2 b3 4 5 b6 7.<br>${scl('A', 'harm')} = <b>${scn('A', 'harm')}</b>.</p>
<p>Ahora el <b>V es mayor</b> (${c('E')} = ${ns(['E', 'G#', 'B'])}) y aparece la sensible ${n('G#')} → ${n('A')}.</p>
<p class="tip">Cadencias: i-iv-V-i · andaluza i-VII-VI-V (${c('Am')} ${c('G')} ${c('F')} ${c('E')}).</p>`,
    ex: [{ t: 'scale', r: 'A', type: 'harm' }, { t: 'prog', k: 'A', m: 'min', specs: ['i', 'iv', 'v', 'i'], label: 'Con v menor' }, { t: 'prog', k: 'A', m: 'min', specs: ['i', 'iv', 'V', 'i'], label: 'Con V mayor' }, { t: 'prog', k: 'A', m: 'min', specs: ['i', 'VII', 'VI', 'V'], label: 'Andaluza' }] }),
  p1: () => ({ html: `
<p>La <b>pentatónica menor</b> tiene 5 notas: <b>1 b3 4 5 b7</b>.</p>
<p>${scl('A', 'pentMin')} = <b>${scn('A', 'pentMin')}</b>. Es la menor natural sin la 2ª ni la b6, que son las notas que más chocan.</p>
<p><b>Posición 1</b>: empieza en la tónica sobre la 6ª cuerda y lleva 2 notas por cuerda. Es la escala del rock y del blues.</p>`,
    ex: [{ t: 'scale', r: 'A', type: 'pentMin' }, { t: 'fret', r: 'A', type: 'pentMin', pos: 1 }] }),
  p2: () => ({ html: `
<p>Las <b>5 posiciones</b> cubren todo el mástil y se encadenan: las notas más agudas de cada cuerda en una posición son las más graves de la siguiente.</p>
<p>La posición <i>n</i> empieza en la nota <i>n</i> de la escala sobre la 6ª cuerda. En ${n('A')}: pos. 1 traste 5 (${n('A')}), pos. 2 traste 8 (${n('C')}), pos. 3 traste 10 (${n('D')}), pos. 4 traste 12 (${n('E')}), pos. 5 traste 3/15 (${n('G')}).</p>
<p class="tip">Siempre 2 notas por cuerda. Entre la 3ª y la 2ª cuerda la figura se desplaza un traste (por la afinación ${n('G')}-${n('B')}).</p>`,
    ex: [{ t: 'fret', r: 'A', type: 'pentMin', pos: 2 }, { t: 'fret', r: 'A', type: 'pentMin', pos: 3 }] }),
  p3: () => ({ html: `
<p>La <b>pentatónica mayor</b> es 1 2 3 5 6: ${scl('G', 'pentMaj')} = <b>${scn('G', 'pentMaj')}</b>. Suena alegre (country, pop, rock clásico).</p>
<p>Tiene las mismas notas que la pentatónica menor de su relativa (${scl('E', 'pentMin')} = ${scn('E', 'pentMin')}): son las <b>mismas figuras con otra tónica</b>.</p>
<p>La posición 1 de la mayor empieza en su tónica sobre la 6ª cuerda.</p>`,
    ex: [{ t: 'scale', r: 'G', type: 'pentMaj' }, { t: 'fret', r: 'G', type: 'pentMaj', pos: 1 }] }),
  p4: () => ({ html: `
<ol><li>Encuentra la <b>tonalidad</b> (dónde descansa la progresión).</li>
<li>Si es <b>mayor</b>, usa la pentatónica mayor de la tónica (o la menor de su relativa, que tiene las mismas notas).</li>
<li>Si es <b>menor</b>, usa la pentatónica menor de la tónica (o la escala de blues).</li>
<li>Apunta a las <b>notas de cada acorde</b>. Las notas en común entre acordes son puentes seguros.</li></ol>
<p class="tip">Ejemplo: ${c('Am')} ${c('F')} ${c('C')} ${c('G')} → ${n('A')} menor → ${scl('A', 'pentMin')}.</p>`,
    ex: [{ t: 'prog', k: 'A', m: 'min', specs: ['i', 'VI', 'III', 'VII'], label: `${c('Am')} ${c('F')} ${c('C')} ${c('G')}` }, { t: 'scale', r: 'A', type: 'pentMin' }] }),
  p5: () => ({ html: `
<p>Para escalas de 7 notas usamos el <b>sistema de 3 notas por cuerda</b>: la posición 1 empieza en la tónica sobre la 6ª cuerda y coloca 3 notas en cada cuerda. Hay 7 posiciones, una por grado.</p>
<p>Aquí practicarás la <b>escala mayor</b> y la <b>menor natural</b> en distintas tonalidades.</p>
<p class="tip">Las figuras son más abiertas que las pentatónicas; estira la mano o desliza.</p>`,
    ex: [{ t: 'fret', r: 'G', type: 'major', pos: 1 }, { t: 'fret', r: 'A', type: 'minor', pos: 1 }] }),
  s1: () => ({ html: `
<p>Añadimos una 7ª a la triada mayor:</p>
<ul><li><b>maj7</b> (1 3 5 7): la 7ª mayor queda a un semitono de la octava. Suena suave y "jazzy". ${c('Cmaj7')} = ${ns(['C', 'E', 'G', 'B'])}.</li>
<li><b>7</b> (1 3 5 b7): es el acorde de <b>dominante</b>, una tensión que quiere resolver. ${c('C7')} = ${ns(['C', 'E', 'G', 'Bb'])}. Aparece de forma natural en el V (${c('G7')} en ${n('C')}).</li></ul>
<p class="tip">También se escribe Cmaj7 = CΔ = C7M.</p>`,
    ex: [{ t: 'chord', v: 'Cmaj7' }, { t: 'chord', v: 'C7' }, { t: 'prog', k: 'C', m: 'maj', specs: ['V7', 'Imaj7'], label: `${c('G7')} → ${c('Cmaj7')}` }] }),
  s2: () => ({ html: `
<ul><li><b>m7</b> (1 b3 5 b7): un menor suave. ${c('Am7')} = ${ns(['A', 'C', 'E', 'G'])}.</li>
<li><b>m7b5</b> o ø (1 b3 b5 b7): semidisminuido, oscuro y tenso. ${c('Bm7b5')} = ${ns(['B', 'D', 'F', 'A'])}. Es el vii de la mayor y el ii de la menor.</li></ul>`,
    ex: [{ t: 'chord', v: 'Am7' }, { t: 'chord', v: 'Bm7b5' }, { t: 'chord', v: 'Am' }] }),
  s3: () => ({ html: `
<p>Campo armónico con séptimas: <b>Imaj7 ii7 iii7 IVmaj7 V7 vi7 viiø7</b>.</p>
<p>En ${n('C')}: <b>${field(key('C', 'maj'), true).map(x => chordName(x)).join(' · ')}</b></p>
<p>En menor: i7 iiø7 IIImaj7 iv7 v7 VImaj7 VII7.</p>
<p class="tip">En la mayor solo hay un acorde 7 (dominante), el V7. Cuando oigas un acorde 7, ya sabes dónde está el V.</p>`,
    ex: [{ t: 'prog', k: 'C', m: 'maj', specs: ['Imaj7', 'ii7', 'iii7', 'IVmaj7', 'V7', 'vi7', 'viiø7', 'Imaj7'], label: 'Campo con 7ª' }] }),
  s4: () => ({ html: `
<p>La cadencia más importante del jazz: <b>ii7 → V7 → Imaj7</b>. En ${n('C')}: ${c('Dm7')} ${c('G7')} ${c('Cmaj7')}.</p>
<p>Las raíces bajan por quintas (${ns(['D', 'G', 'C'])}).</p>
<p><b>Notas guía</b>: la 7ª de cada acorde baja un semitono a la 3ª del siguiente (${n('C')} de ${c('Dm7')} → ${n('B')} de ${c('G7')}; ${n('F')} de ${c('G7')} → ${n('E')} de ${c('Cmaj7')}).</p>
<p class="tip">Para improvisar: escala mayor de la tónica sobre los tres acordes.</p>`,
    ex: [{ t: 'prog', k: 'C', m: 'maj', specs: ['ii7', 'V7', 'Imaj7', 'Imaj7'], label: 'ii-V-I en ' + n('C') }, { t: 'prog', k: 'F', m: 'maj', specs: ['ii7', 'V7', 'Imaj7', 'Imaj7'], label: 'ii-V-I en ' + n('F') }] }),
  s5: () => ({ html: `
<p>En menor: <b>iiø7 → V7 → i7</b>. En ${n('A')} menor: ${c('Bm7b5')} ${c('E7')} ${c('Am7')}.</p>

<p class="tip">Para improvisar: menor armónica de la tónica (sobre todo encima del V7), y menor natural o pentatónica menor en el resto.</p>`,
    ex: [{ t: 'prog', k: 'A', m: 'min', specs: ['iiø7', 'V7', 'i7', 'i7'], label: 'ii-V-i en ' + n('A') }, { t: 'scale', r: 'A', type: 'harm' }] }),
  b1: () => ({ html: `
<p>Escala de blues = pentatónica menor + <b>b5</b> (la "blue note"): <b>1 b3 4 b5 5 b7</b>.</p>
<p>${scl('A', 'blues')} = <b>${scn('A', 'blues')}</b>.</p>
<p>La b5 es una nota de paso: una tensión que resuelve a la 4ª o a la 5ª. En el mástil está un traste por encima de cada 4ª de la caja pentatónica.</p>`,

  b2: () => ({ html: `
<p>La forma de blues de 12 compases:</p>
<p class="big2">| I7 | I7 | I7 | I7 |<br>| IV7 | IV7 | I7 | I7 |<br>| V7 | IV7 | I7 | V7 |</p>
<p>En ${n('A')}: ${c('A7')} ${c('D7')} ${c('E7')}. <b>Todos son dominantes (7)</b>.</p>
<p class="tip">Variante "quick change": IV7 en el compás 2. El último V7 es el <i>turnaround</i> que devuelve al principio.</p>`,
    ex: [{ t: 'prog', k: 'A', m: 'maj', specs: REP.blues[0], label: `Blues en ${n('A')}` }] }),
  b3: () => ({ html: `
<p>Sobre un blues (${c('A7')}), la pentatónica menor (${scn('A', 'pentMin')}) "choca con gracia" con la 3ª mayor del acorde (${n('C#')}).</p>

    for (let f = 0; f <= FR; f++) o.push(`<text class="fb-num" x="${this.x(f)}" y="${H - 6}">${f}</text>`);
    marks.forEach(m => {
      const cx = this.x(m.f), cy = this.y(m.s);
      o.push(`<circle class="fb-dot ${m.cls}" cx="${cx}" cy="${cy}" r="15" style="pointer-events:none"/>`);
      if (m.ring) o.push(`<circle class="fb-ring" cx="${cx}" cy="${cy}" r="19.5" style="pointer-events:none"/>`);
      if (m.label) o.push(`<text class="fb-lbl${m.cls === 'miss' ? ' dark' : ''}" x="${cx}" y="${cy}" style="font-size:${m.label.length > 3 ? 9.5 : 11.5}px">${m.label}</text>`);
    });
    if (act) for (let s = 0; s < 6; s++) for (let f = 0; f <= FR; f++) {
      const x0 = f === 0 ? 0 : OW + (f - 1) * FW, w = f === 0 ? OW : FW;
      o.push(`<rect class="fb-hit" data-act="${act}" data-s="${s}" data-f="${f}" x="${x0}" y="${this.y(s) - SP / 2}" width="${w}" height="${SP}"/>`);
    }
    o.push('</svg>');
    return o.join('');
  },
  scrollTo(el, fret) { if (!el) return; const x = this.x(fret) - 70; el.scrollLeft = Math.max(0, x); },
};

const SERIES_LEN = 10;          // ejercicios por serie
const PASS = 0.8;               // 80 % para dominar un tema
const $ = sel => document.querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const blockOf = t => Core.BLOCKS[t.b - 1];

/* ---------- Estado de progreso ---------- */
function mStatus(tid, m) {
  const list = Core.modeTopics(m); const i = list.findIndex(t => t.id === tid);
  if (i < 0) return null;
  if (Store.get(tid, m).done) return 'done';
  if (i === 0 || Store.get(list[i - 1].id, m).done) return 'open';
  return 'locked';
}
function tStatus(t) {
  const st = t.m.map(m => mStatus(t.id, m));
  if (st.every(s => s === 'done')) return 'done';
  if (st.some(s => s !== 'locked')) return 'open';
  return 'locked';
}
const nextTopic = m => Core.modeTopics(m).find(t => mStatus(t.id, m) === 'open');
const unlockedTopics = m => Core.modeTopics(m).filter(t => mStatus(t.id, m) !== 'locked');
function tierOf(tid, m) { const ok = Store.get(tid, m).ok; return ok < 10 ? 0 : ok < 25 ? 1 : 2; }
const STATUS_TXT = { locked: 'Bloqueado', open: 'En curso', done: 'Dominado' };
const STATUS_ICO = { locked: '🔒', open: '🟡', done: '✅' };

/* ---------- Estado de la app ---------- */
const S = { screen: 'home', p: {}, sess: null, result: null, tests: null, confirmReset: false };
function go(screen, p = {}) {

  S.screen = screen; S.p = p; render(); window.scrollTo(0, 0);
}
function toast(msg) {
  const old = $('.toast'); if (old) old.remove();
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d);
  setTimeout(() => d.remove(), 2300);
}
function applySettings() {

function scrLesson() {
  const t = Core.topicById(S.p.tid); const b = blockOf(t); const L = Core.LESSONS[t.id]();
  const exBtns = L.ex.filter(e => !['fret', 'fretnat'].includes(e.t)).map((e, i) => `<button class="btn ghost sm" data-act="ex" data-i="${L.ex.indexOf(e)}">▶ ${esc(exLabel(e))}</button>`).join('');

function exLabel(e) {
  if (e.label) return e.label;
  if (e.t === 'chord') return Core.chordName(Core.parseChord(e.v));
  if (e.t === 'scale') return Core.scaleName(Core.N(e.r), e.type);
  if (e.t === 'iv') return Core.INTERVALS.find(x => x.s === e.s).name;
  return '';
}
function lessonMarks(e) {
  if (e.t === 'fretnat') {
    const out = []; for (const s of [0, 1]) for (let f = 0; f <= 12; f++) { const pc = Core.cellPc(s, f); if (Core.NAT.includes(pc)) out.push({ s, f, cls: 'fig', label: Core.noteName(Core.noteFromPc(pc)) }); }
    return out;
  }
  const fig = Core.scalePosition(Core.N(e.r), e.type, e.pos); if (!fig) return [];
  return fig.cells.map(c => ({ s: c.s, f: c.f, cls: c.pc === fig.rootPc ? 'ok' : 'fig', label: Core.noteName(c.n), ring: c.pc === fig.rootPc }));
}
function playExample(e) {
  Sound.unlock();
  if (e.t === 'chord') Play.chord(Core.parseChord(e.v));
  else if (e.t === 'notes') Play.melody(Play.notesUp(e.v.map(Core.N)), 0.34);
  else if (e.t === 'scale') { const ns = Core.scaleNotes(Core.N(e.r), e.type); Play.melody(Play.notesUp(ns.concat([ns[0]])), 0.3); }
  else if (e.t === 'iv') Play.interval(48 + Core.pcOf(Core.N(e.r)), e.s);
  else if (e.t === 'prog') { const k = Core.key(e.k, e.m); Looper.start(e.specs.map(s => Core.chordFromSpec(k, s)), 100, null, true); }
}

/* ---------- Sesión de ejercicios ---------- */
function startSeries(m, kind, tid) {
  Sound.unlock();
  S.sess = { m, kind, tid, total: 0, correct: 0, item: null, qi: 0, answers: [], fb: null, fretSel: new Set(), bpm: null, playing: false, curTid: null };
  newItem(); go('ex');
}
function newItem() {
  const s = S.sess; Looper.stop(true);
  let tid = s.tid;
  if (s.kind === 'review') { const un = unlockedTopics(s.m); tid = un[Math.floor(Math.random() * un.length)].id; }
  s.curTid = tid;
  s.item = Core.generate(tid, s.m, tierOf(tid, s.m));
  s.qi = 0; s.answers = []; s.fb = null; s.fretSel = new Set();
  s.bpm = Store.data.settings.tempo + s.item.tier * 8;
  if (S.screen === 'ex') render();
  setTimeout(autoPlay, 350);
}
function autoPlay() {
  const s = S.sess; if (!s || S.screen !== 'ex') return; const a = s.item.audio; if (!a) return;
  if (a.type === 'chord') Play.chord(a.chord);
  else if (a.type === 'interval') Play.interval(a.midi, a.semis);
  else if (a.type === 'prog') startLoop();
}
function startLoop() {
  const s = S.sess; s.playing = true;
  Looper.start(s.item.audio.chords, s.bpm, i => {
    document.querySelectorAll('#bardots i').forEach((el, k) => el.classList.toggle('on', k === i));
    if (i === -2) { const b = $('#playbtn'); if (b) b.textContent = '▶ Reproducir'; }
  });
  const b = $('#playbtn'); if (b) b.textContent = '⏸ Pausa';
}
const curQ = () => S.sess.item.questions[S.sess.qi];
function submit(value) {
  const s = S.sess; if (!s || s.fb) return;
  const q = curQ();
  if (q.type !== 'fret' && !String(value).trim()) { toast('Escribe una respuesta'); return; }
  const ok = !!q.check(value);
  s.total++; if (ok) s.correct++;
  const p = Store.tp(s.curTid, s.m); p.tot++; if (ok) { p.ok++; Store.data.stats.xp++; }
  Store.save();
  s.fb = { ok, given: q.type === 'fret' ? '' : String(value) };
  s.answers.push({ q, ok });
  s.keepFocus = document.activeElement && document.activeElement.id === 'ans';
  render();
  if (ok) s.autoT = setTimeout(advance, q.type === 'fret' ? 1500 : 950);
}
function advance() {
  const s = S.sess; if (!s || !s.fb) return; clearTimeout(s.autoT);
  s.fb = null; s.qi++; s.fretSel = new Set();
  if (s.qi < s.item.questions.length) { render(); return; }
  if (s.total >= SERIES_LEN) finish(); else newItem();
}
function finish() {
  const s = S.sess; Looper.stop();
  const pct = s.total ? s.correct / s.total : 0;
  let unlocked = null, mastered = false;
  const st = Store.data.stats; st.series = (st.series || 0) + 1;
  const today = new Date(); const d = today.toISOString().slice(0, 10); const y = new Date(today - 864e5).toISOString().slice(0, 10);
  if (st.last !== d) { st.streak = st.last === y ? (st.streak || 0) + 1 : 1; st.last = d; }
  if (s.kind === 'learn') {
    const p = Store.tp(s.tid, s.m); p.att++; p.best = Math.max(p.best, pct);
    if (pct >= PASS && !p.done) { p.done = true; mastered = true; unlocked = nextTopic(s.m); }
  }
  Store.save();
  S.result = { pct, correct: s.correct, total: s.total, kind: s.kind, m: s.m, tid: s.tid, mastered, unlocked };
  go('result');
}

const KEYSETS = {
  chord: ['#', 'b', 'm', '7', 'maj7', 'm7b5', 'dim', 'aug', 'sus2', 'sus4', 'add9', '9', '␣'],
  note: ['#', 'b', '␣'],
  degree: ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'i', 'ii', 'iii', 'iv', 'v', 'vi', 'vii', 'b', '°', 'ø', '7', 'maj7', '/', '␣'],
  scale: ['pentatónica ', 'menor ', 'mayor ', 'blues ', 'de ', 'dórico ', 'mixolidio ', 'lidio ', 'armónica ', 'natural '],
  interval: ['2', '3', '4', '5', '6', '7', '8', 'M', 'm', 'J', 'tritono'],
  ts: ['T', 'S', '-'], num: [], text: [], none: [],
};
const PLACEHOLDER = { chord: 'Ej.: Am7 / La menor 7', note: 'Ej.: A C E G / La Do Mi Sol', degree: 'Ej.: I vi IV V / 1 6 4 5', scale: 'Ej.: pentatónica menor de La', interval: 'Ej.: 3M, 5J, tritono', ts: 'Ej.: T T S…', num: 'Número', text: 'Tu respuesta' };

function fretMarks() {
  const s = S.sess, it = s.item, q = curQ(), fb = s.fb;
  if (it.blankCell) {
    const c = it.blankCell;
    return [{ s: c.s, f: c.f, cls: fb ? (fb.ok ? 'ok' : 'bad') : 'ask', label: fb ? Core.noteName(Core.noteFromPc(c.pc)) : '?' }];
  }
  const fig = it.fig; if (!fig) return [];
  const key = c => c.s + ':' + c.f;
  if (q.type === 'fret') {
    if (!fb) return [...s.fretSel].map(k => { const [a, b] = k.split(':').map(Number); return { s: a, f: b, cls: 'sel' }; });
    const want = new Set(fig.cells.map(key)); const out = [];
    fig.cells.forEach(c => out.push({ s: c.s, f: c.f, cls: s.fretSel.has(key(c)) ? 'ok' : 'miss', ring: c.pc === fig.rootPc, label: c.pc === fig.rootPc ? 'R' : '' }));
    s.fretSel.forEach(k => { if (!want.has(k)) { const [a, b] = k.split(':').map(Number); out.push({ s: a, f: b, cls: 'bad', label: '✕' }); } });
    return out;
  }
  // preguntas de nombrar notas sobre la figura
  const answered = new Map();
  it.questions.slice(1, s.qi).forEach((qq, i) => answered.set(key(qq.cell), s.answers[i + 1]));
  return fig.cells.map(c => {
    const k = key(c); const isCur = q.cell && key(q.cell) === k;
    if (isCur) return { s: c.s, f: c.f, cls: fb ? (fb.ok ? 'ok' : 'bad') : 'ask', label: fb ? Core.noteName(c.n) : '?', ring: c.pc === fig.rootPc };
    if (answered.has(k)) return { s: c.s, f: c.f, cls: answered.get(k).ok ? 'ok' : 'bad', label: Core.noteName(c.n), ring: c.pc === fig.rootPc };
    return { s: c.s, f: c.f, cls: 'fig', ring: c.pc === fig.rootPc, label: c.pc === fig.rootPc && s.qi > 0 ? 'R' : '' };
  });
}

function scrEx() {
  const s = S.sess, it = s.item, q = curQ(), fb = s.fb, t = Core.topicById(s.curTid), m = Core.MODES[s.m];
  const learn = s.kind === 'learn';
  const pct = Math.min(100, (s.total / SERIES_LEN) * 100);
  // respuestas fijadas arriba (modos 2 y 3, y figuras)
  let pinned = '';
  const prev = it.questions.slice(0, s.qi).map((qq, i) => ({ qq, ok: s.answers[i].ok })).filter(x => x.qq.type !== 'fretnote' && x.qq.type !== 'fret');
  if (it.header || prev.length) {
    pinned = `<div class="pinned">${it.header || ''}${prev.map(x => `<div class="pin ${x.ok ? 'good' : 'bad'}"><span class="pl">${esc(x.qq.label)}</span><span class="pv">${esc(x.qq.sol)}</span></div>`).join('')}</div>`;
  }
  // audio
  let audio = '';
  const ref = `<button class="btn ghost sm" data-act="ref">🎯 Referencia ${Core.noteName(Core.N('C'))}</button>`;
  if (it.audio && it.audio.type === 'chord') audio = `<div class="audiobar"><button class="btn sm" data-act="replay">▶ Escuchar otra vez</button><button class="btn ghost sm" data-act="replayalt">${Store.data.settings.playback === 'arp' ? '🎸 Plaqueado' : '🎼 Arpegiado'}</button>${ref}</div>`;
  if (it.audio && it.audio.type === 'interval') audio = `<div class="audiobar"><button class="btn sm" data-act="replay">▶ Escuchar otra vez</button></div>`;
  if (it.audio && it.audio.type === 'prog') audio = `<div class="bardots" id="bardots">${it.audio.chords.map(() => '<i></i>').join('')}</div>
    <div class="audiobar"><button class="btn sm" id="playbtn" data-act="toggleplay">${Looper.on ? '⏸ Pausa' : '▶ Reproducir'}</button>${ref}
    <div class="tempo"><button data-act="tempo" data-v="-6" aria-label="Más lento">−</button><b>♩ = ${s.bpm} BPM</b><button data-act="tempo" data-v="6" aria-label="Más rápido">+</button></div></div>`;
  // mástil
  let fret = '';
  if (it.fig || it.blankCell) {
    const interactive = q.type === 'fret' && !fb;
    fret = `<div class="fretwrap" id="fret">${Fret.svg(fretMarks(), interactive ? 'fret' : 'fplay')}</div>`;
    if (q.type === 'fret' && fb) fret += `<div class="flegend"><span><i style="background:var(--good)"></i>Acertada</span><span><i style="background:var(--bad)"></i>Sobra</span><span><i style="border:2px dashed var(--warn)"></i>Faltaba</span><span><i style="border:3px solid var(--text)"></i>Tónica (R)</span></div>`;
  }
  // corrección
  let feedback = '';
  if (fb) {
    const given = fb.given ? `<div class="yours">Tu respuesta: ${esc(fb.given)}</div>` : '';
    if (fb.ok) feedback = `<div class="feedback ok"><div class="fh">✅ ${learn ? '¡Correcto!' : 'Correcto'}</div>${q.type === 'fretnote' ? `<div>${esc(q.sol)}</div>` : ''}</div>`;
    else feedback = `<div class="feedback ko"><div class="fh">❌ Incorrecto</div>${given}${q.type === 'fret' ? '<div class="sol">Mira la figura correcta en el mástil.</div>' : `<div>Respuesta correcta:</div><div class="sol">${esc(q.sol)}</div>`}${learn && q.explain ? `<div class="exp">💡 ${q.explain}</div>` : ''}</div>`;
  }
  // barra de respuesta
  let answer;
  if (fb) answer = `<button class="btn ${fb.ok ? 'good' : ''}" data-act="next">${fb.ok ? 'Siguiente ▶' : 'Continuar ▶'}</button>`;
  else if (q.type === 'fret') answer = `<div class="row"><button class="btn ghost" data-act="fretclear">🧽 Borrar</button><button class="btn" data-act="send">Enviar ✓</button></div>`;
  else {
    const keys = (KEYSETS[q.keys] || []).map(k => `<button data-act="key" data-v="${esc(k)}">${k === '␣' ? '␣ espacio' : esc(k.trim())}</button>`).join('');
    answer = `${keys ? `<div class="keys">${keys}<button data-act="key" data-v="⌫" aria-label="Borrar">⌫</button></div>` : ''}
    <div class="inrow"><input id="ans" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" ${q.keys === 'num' ? 'inputmode="numeric"' : ''} placeholder="${PLACEHOLDER[q.keys] || ''}" aria-label="Respuesta"><button class="btn" data-act="send">Enviar</button></div>`;
  }
  const multi = it.questions.length > 1 ? `<span class="badge">Pregunta ${s.qi + 1}/${it.questions.length}</span>` : '';
  return `<div class="exbar"><button class="iconbtn" data-act="quit" aria-label="Salir">✕</button><div class="pbar"><i style="width:${pct}%;background:var(--${s.m})"></i></div><div class="score">${s.correct}/${s.total}</div></div>
  <div class="topicline"><span class="badge" style="background:var(--${s.m});color:#fff">${m.icon} ${m.short}</span>${esc(t.t)}<span class="badge">${learn ? 'Aprender' : 'Repasar'}</span><span class="badge">Nivel ${it.tier + 1}/3</span>${multi}</div>
  <main>${pinned}<div class="card"><div class="prompt">${q.prompt}</div>${audio}${fret}${feedback}</div></main>
  <div class="answer">${answer}</div>`;
}

function scrResult() {
  const r = S.result; const p = Math.round(r.pct * 100); const t = Core.topicById(r.tid); const pass = r.pct >= PASS;
  let title, sub = '';
  if (r.kind === 'review') { title = pass ? '¡Buen repaso!' : 'Repaso completado'; sub = pass ? 'Lo tienes fresco.' : 'Vale la pena repasar otra vez.'; }
  else if (r.mastered) { title = '¡Tema dominado! 🎉'; sub = r.unlocked ? `Desbloqueado: <b>${esc(r.unlocked.t)}</b>` : '¡Has completado todos los temas de este modo!'; }
  else if (pass) { title = '¡Muy bien!'; sub = 'Este tema ya estaba dominado. Sigue subiendo de nivel.'; }
  else { title = '¡Casi!'; sub = `Necesitas un ${PASS * 100} % para dominar <b>${esc(t.t)}</b>. ¡Otra serie!`; }
  const c = pass ? 'var(--good)' : p >= 50 ? 'var(--warn)' : 'var(--bad)';
  return `${topBar('Resultado', '', 'mode:' + r.m)}<main><div class="card result">
    ${r.mastered ? '<div class="confetti">🏆</div>' : ''}
    <div class="ring" style="--p:${p};--c:${c}"><span>${p}%</span></div>
    <h2 style="margin:6px 0">${title}</h2><p class="muted">${r.correct} de ${r.total} correctas</p><p>${sub}</p></div>
    <div class="stack">
      ${r.mastered && r.unlocked ? `<button class="btn good" data-act="lesson2" data-v="${r.unlocked.id}" data-m="${r.m}">▶ Siguiente tema</button>` : ''}
      <button class="btn${r.mastered && r.unlocked ? ' ghost' : ''}" data-act="again">🔁 Otra serie</button>
      <button class="btn ghost" data-act="go" data-v="home">🏠 Inicio</button>
    </div></main>`;
}

function scrSettings() {
  const s = Store.data.settings;
  const seg = (k, opts) => `<div class="seg">${opts.map(([v, l]) => `<button class="${s[k] === v ? 'on' : ''}" data-act="set" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
  const tr = S.tests;
  return `${topBar('Ajustes')}<main><div class="card">
    <div class="set"><b>Notación</b>${seg('notation', [['latin', 'Latina (Do, Re, Mi)'], ['american', 'Americana (C, D, E)']])}</div>
    <div class="set"><b>Tema</b>${seg('theme', [['auto', 'Auto'], ['light', 'Claro'], ['dark', 'Oscuro']])}</div>
    <div class="set"><label for="vol">Volumen · ${Math.round(s.volume * 100)} %</label><input id="vol" type="range" min="0" max="1" step="0.05" value="${s.volume}" data-range="volume"></div>
    <div class="set"><label for="tmp">Tempo de las progresiones · ${s.tempo} BPM</label><input id="tmp" type="range" min="50" max="160" step="2" value="${s.tempo}" data-range="tempo"></div>
    <div class="set"><b>Reproducción de acordes</b>${seg('playback', [['block', '🎸 Plaqueado'], ['arp', '🎼 Arpegiado']])}</div>
    <div class="set"><button class="btn ghost sm" data-act="soundtest">🔊 Probar sonido</button><p class="help" style="margin:0">En iPhone, si no oyes nada, quita el modo silencio y sube el volumen.</p></div>
  </div>
  <h2>Progreso</h2><div class="card stack">
    <button class="btn ghost" data-act="export">⬇️ Exportar progreso (JSON)</button>
    <button class="btn ghost" data-act="import">⬆️ Importar progreso</button>
    <input type="file" id="importfile" accept="application/json,.json" hidden>
    <button class="btn bad" data-act="reset">${S.confirmReset ? '⚠️ Pulsa otra vez para borrar todo' : '🗑️ Reiniciar progreso'}</button>
  </div>
  <h2>Cómo escribir las respuestas</h2><div class="card help">
    <p>Acordes: <code>C</code> <code>Do</code> <code>Cm</code> <code>Do menor</code> <code>Dom</code> <code>C7</code> <code>Cmaj7</code> <code>CΔ</code> <code>Do7M</code> <code>Bm7b5</code> <code>Bø</code> <code>B°</code> <code>C+</code> <code>Dsus4</code> <code>Cadd9</code>. Se aceptan enharmonías (<code>A#</code> = <code>Bb</code> = <code>Sib</code>), mayúsculas o minúsculas, y con o sin espacios.</p>
    <p>Varias notas o acordes: sepáralos con espacios o comas: <code>La Do Mi Sol</code>, <code>C Em Am G</code>.</p>
    <p>Grados: <code>1 3 6 5</code> o <code>I iii vi V</code>; también <code>bVII</code>, <code>V/V</code>, <code>ii7</code>.</p>
    <p>Escalas: <code>pentatónica menor de La</code>, <code>blues de A</code>, <code>Sol mixolidio</code>, <code>Do mayor</code>.</p>
    <p>Intervalos: <code>3M</code>, <code>3m</code>, <code>5J</code>, <code>tercera mayor</code>, <code>tritono</code>. La <b>M</b> mayúscula junto a 7 o 9 significa séptima mayor (<code>C7M</code>).</p>
  </div>
  <h2>Pruebas automáticas</h2><div class="card stack">
    <button class="btn ghost" data-act="tests">🧪 Ejecutar pruebas de teoría</button>
    ${tr ? `<div class="testlog">${tr.fail ? '❌' : '✅'} ${tr.pass} comprobaciones correctas · ${tr.fail} fallos\n${esc(tr.log.slice(0, 40).join('\n'))}</div>` : ''}
  </div>
  <p class="help" style="text-align:center">Diapasón · 100 % offline · sonido sintetizado con Karplus-Strong</p></main>`;
}

/* ---------- Render ---------- */
function render() {
  const app = $('#app');
  const f = { home: scrHome, map: scrMap, topic: scrTopic, mode: scrMode, lesson: scrLesson, ex: scrEx, result: scrResult, settings: scrSettings }[S.screen] || scrHome;
  app.innerHTML = f();
  // tras pintar
  document.querySelectorAll('.lessonfret').forEach(el => Fret.scrollTo(el, +el.dataset.start));
  if (S.screen === 'ex') {
    const s = S.sess; const fr = $('#fret');
    if (fr) { const st = s.item.fig ? s.item.fig.start : s.item.blankCell.f; Fret.scrollTo(fr, s.item.blankCell ? Math.max(0, st - 3) : st); }
    const inp = $('#ans');
    if (inp && !s.fb && (s.keepFocus || window.matchMedia('(pointer: fine)').matches)) inp.focus({ preventScroll: true });
    if (s.item.audio && s.item.audio.type === 'prog') { const b = $('#playbtn'); if (b) b.textContent = Looper.on ? '⏸ Pausa' : '▶ Reproducir'; }
    if (s.fb && !s.fb.ok) { const el = $('.feedback'); if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }
}

/* ---------- Acciones ---------- */
const ACT = {
  go(d) { const [scr, arg] = d.v.split(':'); if (scr === 'mode') go('mode', { m: arg }); else if (scr === 'topic') go('topic', { tid: arg }); else go(scr); },
  mode(d) { go('mode', { m: d.v }); },
  topic(d) { go('topic', { tid: d.v }); },
  lesson(d) { go('lesson', { tid: d.v }); },
  lesson2(d) { go('lesson', { tid: d.v, m: d.m }); },
  learn(d) {
    if (!d.v) return;
    if (mStatus(d.v, d.m) === 'locked') { const list = Core.modeTopics(d.m); const i = list.findIndex(t => t.id === d.v); toast(`🔒 Domina antes «${list[i - 1].t}» en este modo`); return; }
    go('lesson', { tid: d.v, m: d.m });
  },
  start(d) { startSeries(d.m, 'learn', d.v); },
  review(d) { startSeries(d.m, 'review', null); },
  again() { const r = S.result; startSeries(r.m, r.kind, r.tid); },
  ex(d) { const L = Core.LESSONS[S.p.tid](); playExample(L.ex[+d.i]); },
  quit() { const m = S.sess.m; S.sess = null; go('mode', { m }); },
  replay() { const a = S.sess.item.audio; if (a.type === 'chord') Play.chord(a.chord); else Play.interval(a.midi, a.semis); },
  replayalt() { Play.chord(S.sess.item.audio.chord, Store.data.settings.playback === 'arp' ? 'block' : 'arp'); },
  ref() { Play.note(60); },
  toggleplay() { if (Looper.on) { Looper.stop(); S.sess.playing = false; } else startLoop(); },
  tempo(d) { const s = S.sess; s.bpm = Math.max(40, Math.min(180, s.bpm + +d.v)); Looper.setTempo(s.bpm); const b = document.querySelector('.tempo b'); if (b) b.textContent = `♩ = ${s.bpm} BPM`; },
  key(d) {
    const inp = $('#ans'); if (!inp) return; let v = d.v;
    const a = inp.selectionStart != null ? inp.selectionStart : inp.value.length, b = inp.selectionEnd != null ? inp.selectionEnd : inp.value.length;
    if (v === '⌫') { const st = a === b ? Math.max(0, a - 1) : a; inp.value = inp.value.slice(0, st) + inp.value.slice(b); inp.setSelectionRange(st, st); return; }
    if (v === '␣') v = ' ';
    inp.value = inp.value.slice(0, a) + v + inp.value.slice(b); const p = a + v.length; inp.setSelectionRange(p, p);
  },
  send() { const q = curQ(); if (q.type === 'fret') submit(S.sess.fretSel); else submit(($('#ans') || {}).value || ''); },
  next() { advance(); },
  fret(d) {
    const s = S.sess; if (!s || s.fb || curQ().type !== 'fret') return;
    const k = d.s + ':' + d.f; if (s.fretSel.has(k)) s.fretSel.delete(k); else { s.fretSel.add(k); Play.note(Core.TUNING[+d.s] + +d.f); }
    const el = $('#fret'); if (el) { const sl = el.scrollLeft; el.innerHTML = Fret.svg(fretMarks(), 'fret'); el.scrollLeft = sl; }
  },
  fplay(d) { Play.note(Core.TUNING[+d.s] + +d.f); },
  fretclear() { S.sess.fretSel = new Set(); const el = $('#fret'); if (el) { const sl = el.scrollLeft; el.innerHTML = Fret.svg([], 'fret'); el.scrollLeft = sl; } },
  set(d) { Store.data.settings[d.k] = d.v; Store.save(); applySettings(); render(); },
  soundtest() { Play.chord(Core.parseChord('C')); },
  export() {
    try {
      const blob = new Blob([JSON.stringify(Store.data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href = url; a.download = `diapason-progreso-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500); toast('Progreso exportado');
    } catch (e) { toast('No se pudo exportar: ' + e.message); }
  },
  import() { $('#importfile').click(); },
  reset() {
    if (!S.confirmReset) { S.confirmReset = true; render(); setTimeout(() => { S.confirmReset = false; if (S.screen === 'settings') render(); }, 4000); return; }
    S.confirmReset = false; Store.reset(); applySettings(); toast('Progreso reiniciado'); render();
  },
  tests() { toast('Ejecutando pruebas…'); setTimeout(() => { S.tests = Core.runTests({ quick: true }); render(); }, 50); },
};

/* ---------- Eventos globales ---------- */
function init() {
  Store.load(); applySettings();
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset); }
  });
  // primer toque: desbloquea el audio (requisito de iOS y Android)
  const unlockOnce = () => { Sound.unlock(); };
  ['pointerdown', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, unlockOnce, { passive: true }));
  document.addEventListener('keydown', e => {
    if (S.screen !== 'ex' || !S.sess) return;
    if (e.key === 'Enter') { e.preventDefault(); if (S.sess.fb) advance(); else ACT.send(); }
  });
  document.addEventListener('input', e => {
    const k = e.target.dataset && e.target.dataset.range; if (!k) return;
    Store.data.settings[k] = k === 'volume' ? parseFloat(e.target.value) : parseInt(e.target.value, 10);
    const lab = e.target.previousElementSibling; if (lab) lab.textContent = k === 'volume' ? `Volumen · ${Math.round(Store.data.settings.volume * 100)} %` : `Tempo de las progresiones · ${Store.data.settings.tempo} BPM`;
    applySettings(); Store.save();
  });
  document.addEventListener('change', e => {
    if (e.target.id !== 'importfile' || !e.target.files[0]) return;
    const r = new FileReader();
    r.onload = () => { try { Store.importJSON(r.result); applySettings(); toast('Progreso importado ✅'); render(); } catch (err) { toast('Archivo no válido: ' + err.message); } };
    r.readAsText(e.target.files[0]);
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { Looper.stop(); } });
  render();
}
init();
})();
</script>
</body>
</html>
